<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Lights</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --text:#f2f2f7; --dim:#8e8e93; --accent:#ffd60a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; padding-bottom:40px; background:var(--bg); color:var(--text);
         font:16px -apple-system, system-ui, sans-serif; max-width:520px; margin-inline:auto; }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:600; font-size:18px; }
  .state { color:var(--dim); font-size:13px; margin-top:2px; }
  button { background:#2c2c2e; color:var(--text); border:0; border-radius:12px; padding:12px 16px;
           font-size:16px; touch-action:manipulation; }
  button:active { opacity:.6; }
  button.on { background:var(--accent); color:#000; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .row button { flex:1; min-width:70px; }
  .dots { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .dot { width:36px; height:36px; border-radius:50%; padding:0; border:2px solid #0006; }
  input[type=range] { width:100%; margin-top:12px; accent-color:var(--accent); }
  input[type=time], select { flex:1; min-width:90px; background:#2c2c2e; color:var(--text); border:0; border-radius:12px;
                             padding:12px; font-size:16px; }
  .alarm { display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px; }
  .alarm small { color:var(--dim); display:block; }
  input[type=color] { width:36px; height:36px; border:0; padding:0; background:none; }
  #msg { position:fixed; left:16px; right:16px; bottom:16px; background:#000c; color:#fff; padding:10px 14px;
         border-radius:12px; opacity:0; transition:opacity .2s; text-align:center; pointer-events:none; }
  #msg.show { opacity:1; }
  #msg.err { background:#b00020; }
</style>
</head>
<body>
<h1>Lights</h1>
<div class="card">
  <div class="head"><span class="name">All lights</span></div>
  <div class="row">
    <button onclick="run('on')">On</button>
    <button onclick="run('off')">Off</button>
    <button onclick="run('party 30s')">Party 30s</button>
    <button onclick="run('sunrise')">Sunrise</button>
    <button onclick="run('pomodoro')">Pomodoro</button>
  </div>
</div>
<div id="running"></div>
<div id="lights"></div>
<div class="card">
  <div class="head"><span class="name">Alarms</span></div>
  <div class="row">
    <input type="time" id="at" value="07:00">
    <select id="what">
      <option value="sunrise 100s">Sunrise 100s</option>
      <option value="sunrise 5m">Sunrise 5m</option>
      <option value="sunrise 15m">Sunrise 15m</option>
      <option value="pomodoro">Pomodoro 25/5</option>
      <option value="on">Turn on</option>
      <option value="off">Turn off</option>
    </select>
    <select id="who"><option value="">All lights</option></select>
  </div>
  <div class="row"><button class="on" onclick="setAlarm()">Set alarm</button></div>
  <div id="timers"></div>
</div>
<div id="msg"></div>
<script>
const COLORS = { red:'#ff2d2d', orange:'#ff8c00', yellow:'#ffd60a', green:'#30d158', cyan:'#00c7ff', blue:'#2f5bff', purple:'#a742ff', pink:'#ff4fa3' };
const Q = location.search;  // keeps ?key=... on API calls
const msg = document.getElementById('msg');
let timer;
function toast(text, err) {
  msg.textContent = text; msg.className = 'show' + (err ? ' err' : '');
  clearTimeout(timer); timer = setTimeout(() => msg.className = '', 2500);
}
async function run(args) {
  toast('…');
  try {
    const r = await (await fetch('/api/run' + Q, { method:'POST', body: JSON.stringify({ args }) })).json();
    toast(r.output || 'ok', !r.ok);
  } catch (e) { toast('request failed', true); }
  refresh(); refreshTimers();
}
function card(name, state, caps) {
  const bri = (state.match(/brightness (\d+)/) || [])[1] || 50;
  const on = !state.startsWith('off') && !state.includes('error');
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="head">
      <div><div class="name">${name}</div><div class="state">${state}</div></div>
      <button class="${on ? 'on' : ''}" onclick="run('${name} toggle')">${on ? 'On' : 'Off'}</button>
    </div>
    ${caps.includes('color') ? `<div class="dots">
      ${Object.entries(COLORS).map(([c, hex]) => `<button class="dot" style="background:${hex}" aria-label="${c}" onclick="run('${name} ${c}')"></button>`).join('')}
      <input type="color" aria-label="custom colour" onchange="run('${name} ' + this.value)">
    </div>` : ''}
    <input type="range" min="1" max="100" value="${bri}" aria-label="brightness" onchange="run('${name} ' + this.value)">
    ${caps.includes('kelvin') ? `<input type="range" min="0" max="100" aria-label="warmth (right is warmer)" onchange="run('${name} warmth ' + this.value)">` : ''}
    <div class="row">
      <button onclick="run('${name} warm')">Warm</button>
      <button onclick="run('${name} neutral')">Neutral</button>
      <button onclick="run('${name} cool')">Cool</button>
      <button onclick="run('${name} sunrise')">Sunrise</button>
    </div>`;
  return el;
}
async function refresh() {
  try {
    const { lights, caps } = await (await fetch('/api/status' + Q)).json();
    fillWho(Object.keys(lights));
    const box = document.getElementById('lights');
    const a = document.activeElement;
    if (a && a.tagName === 'INPUT' && box.contains(a)) return;  // don't rebuild while a slider or picker is in use
    box.replaceChildren(...Object.entries(lights).map(([n, s]) => card(n, s, caps[n] || [])));
  } catch (e) {}
}
function setAlarm() {
  const who = document.getElementById('who').value;
  const at = document.getElementById('at').value;
  if (!at) return toast('pick a time', true);
  run((who ? who + ' ' : '') + document.getElementById('what').value + ' at ' + at);
}
async function refreshTimers() {
  try {
    const { timers, running } = await (await fetch('/api/timers' + Q)).json();
    document.getElementById('running').replaceChildren(...running.map(r => {
      const el = document.createElement('div');
      el.className = 'card alarm';
      el.innerHTML = `<div><b>Running</b><small>${r.what}</small></div><button class="on" onclick="run('stop')">Stop</button>`;
      return el;
    }));
    document.getElementById('timers').replaceChildren(...timers.map(t => {
      const el = document.createElement('div');
      el.className = 'alarm';
      el.innerHTML = `<div>${t.at}<small>${t.what}</small></div><button onclick="run('cancel ${t.id}')">Cancel</button>`;
      return el;
    }));
  } catch (e) {}
}
function fillWho(names) {
  const sel = document.getElementById('who');
  if (sel.options.length > 1) return;
  names.forEach(n => sel.add(new Option(n, n)));
}
refresh(); refreshTimers();
setInterval(refresh, 15000);
setInterval(refreshTimers, 4000);
</script>
</body>
</html>
