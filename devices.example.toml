# Copy to devices.toml and fill in. devices.toml is gitignored: it holds secrets.
status_device = "bulb"  # shows Claude Code's state (lights-status); defaults to the first light
# server_key = "pick-a-word"  # optional: `lights serve` then needs ?key=pick-a-word in the address

# Tuya / Smart Life light (Wipro and many others), controlled over the LAN.
[devices.bulb]
type = "tuya"
id = "your_device_id"
ip = "192.168.0.x"
key = "your_local_key"
version = 3.1

# Tuya white-only light (warm to cool, no colours), e.g. a Wipro tubelight. Paired in Smart Life.
[devices.tubelight]
type = "tuya-white"
id = "your_device_id"
ip = "192.168.0.x"
key = "your_local_key"
version = 3.3

# Yeelight protocol over Xiaomi miIO (Mi Bedside Lamp 2).
[devices.lampy]
type = "yeelight"
did = "your_device_id"      # numeric id; lets `fix-ip` find it again
ip = "192.168.0.x"
token = "your_32_char_token"
model = "yeelink.light.bslamp2"

# duoCo StripX Bluetooth light (MELK-* controller, e.g. a Yugam corner lamp). RGB only.
# Only works while this computer is in Bluetooth range. `fix-ip` re-finds it by ble_name.
[devices.corner]
type = "melk"
ble_name = "MELK-OT21   B2"
address = "found-by-fix-ip"  # macOS gives each Bluetooth device a per-computer id

# Scenes: `lights scene night`. Each line is a normal lights command; lines for
# different lights run together. Use your own light names.
[scenes]
night = ["tube warmth 100", "tube 10", "lampy off", "bulb off"]
movie = ["tube warmth 90", "tube 15", "lampy orange", "lampy 20", "bulb off"]
